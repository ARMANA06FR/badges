<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Badges">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Mes Badges</title>
<style>
:root{--g:#2e9e4f;--gd:#1e7d3c;--r:#d63031;--rd:#aa1e1e;--y:#ffc828;--o:#ff8c00;--bg:#fff8e7;--ink:#26323a;--mut:#7a8590;--card:#fff;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 90px)}
h1{font-size:26px;margin:6px 0 2px;color:var(--g);letter-spacing:.3px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ibtn{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;box-shadow:0 2px 8px #0002;cursor:pointer}
.kid{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0001;cursor:pointer;border:0;width:100%;text-align:left;color:inherit;font:inherit}
.kid:active{transform:scale(.98)}
.av{width:84px;height:84px;border-radius:50%;background-size:cover;background-position:center;border:5px solid var(--g);flex:none}
.kid h2{margin:0;font-size:22px}
.cnt{display:flex;gap:10px;margin-top:6px;font-size:14px;font-weight:700}
.cnt .p{color:var(--gd)}.cnt .n{color:var(--rd)}
.bar{height:12px;border-radius:8px;background:#e9e3d2;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y));border-radius:8px;transition:width .5s}
.bal{margin-left:auto;text-align:center;flex:none}
.bal b{display:block;font-size:34px;line-height:1}
.bal small{color:var(--mut);font-size:11px}
.back{border:0;background:none;color:var(--g);font-size:16px;font-weight:700;padding:8px 0;cursor:pointer}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.hero .av{width:96px;height:96px}
.hero h2{margin:0;font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.big{border:0;border-radius:20px;padding:16px 8px;font-size:20px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.big.p{background:var(--g)}.big.n{background:var(--r)}
.big span{display:block;font-size:30px}
.sec{font-size:15px;font-weight:800;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bdg{position:relative;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;cursor:pointer;border:0;padding:0;
 box-shadow:0 0 0 5px var(--c),0 4px 10px #0003;margin:5px;overflow:hidden;color:#fff;font:inherit}
.bdg:active{transform:scale(.93)}
.bdg.neg{--c:var(--r)}.bdg.pos{--c:var(--g)}
.bdg.neg::before{content:"";position:absolute;inset:0;background:#c8403c;mix-blend-mode:color;opacity:.55}
.bdg .lb{position:absolute;left:0;right:0;bottom:14%;background:var(--c);filter:brightness(.82);padding:4px 2px;font-weight:800;font-size:11.5px;line-height:1.1;text-align:center;border-top:2px solid #fff;border-bottom:2px solid #fff;display:flex;align-items:center;justify-content:center;min-height:26px}
.bdg .lb{filter:none;background:color-mix(in srgb,var(--c) 85%,#000)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:15px}
.hist .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.hist .dot.pos{background:var(--g)}.hist .dot.neg{background:var(--r)}.hist .dot.rwd{background:var(--y);color:#7a5a00}
.hist time{margin-left:auto;color:var(--mut);font-size:12px;text-align:right}
.hist button{border:0;background:none;font-size:18px;color:var(--mut);cursor:pointer}
.rew{background:#fff;border:3px dashed var(--y);border-radius:20px;padding:12px 14px;margin:12px 0}
.rew b{color:var(--gd)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;background:var(--g);color:#fff;cursor:pointer}
.btn.sec2{background:#e9e3d2;color:var(--ink)}.btn.red{background:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input[type=text],input[type=number],input[type=password]{width:100%;padding:11px 12px;border-radius:12px;border:2px solid #e2dcc8;font-size:16px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border-radius:999px;padding:6px 6px 6px 12px;font-size:14px;display:flex;align-items:center;gap:4px;box-shadow:0 1px 4px #0002}
.chip button{border:0;background:#eee;border-radius:50%;width:24px;height:24px;cursor:pointer;color:#555}
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
.avs{display:flex;gap:8px;margin-top:6px}
.avs .av{width:56px;height:56px;border-width:4px;border-color:#ddd;cursor:pointer}.avs .av.sel{border-color:var(--g)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 24px);transform:translate(-50%,40px);background:#26323a;color:#fff;padding:12px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:50;max-width:90%;text-align:center;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
#pop{position:fixed;inset:0;display:none;place-items:center;z-index:40;background:#0006}
#pop.on{display:grid}
#pop .box{background:#fff;border-radius:28px;padding:22px;text-align:center;width:min(86vw,340px);animation:pp .35s cubic-bezier(.2,1.6,.4,1)}
#pop .bdg{width:180px;margin:6px auto 12px;cursor:default;font-size:18px}
#pop .bdg .lb{font-size:17px;padding:6px 2px}
#pop h3{margin:0 0 4px;font-size:26px}
@keyframes pp{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.empty{color:var(--mut);text-align:center;padding:14px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 30px)}
.sheet>div{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ---------- données ---------- */
const KEY = "badges_v1";
const POS = ["Bravo !","Super !","Champion !","Merci !","J'ai aidé","Généreux","Courageux","Bien rangé","Devoirs faits","Très poli","J'ai partagé","Bien écouté","Top !","Bien joué !","Calme et sage","Sourire !","Belle action","Fier de toi","Excellent !","Équipe !"];
const NEG = ["Oups !","Attention !","Stop !","On se calme","Pas gentil","Désordre","Pas écouté","Dispute","Trop d'écran","Mensonge","Impoli","Trop de cris","Pas partagé","Devoirs oubliés","À réparer","On recommence","Trop tard","Méchant mot","Carton jaune","Réfléchis !"];
const DEF = () => ({
  kids:[
    {id:"k1",name:"Enfant 1",img:"k1",av:0,goal:20,reward:"Une récompense surprise !"},
    {id:"k2",name:"Enfant 2",img:"k2",av:0,goal:20,reward:"Une récompense surprise !"}],
  pos:POS.slice(), neg:NEG.slice(), events:[], pin:"", sound:true, seen:false});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEF(); } catch(e){ S = DEF(); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const kid = id => S.kids.find(k => k.id === id);
const imgOf = (k, i) => `img/${k.img}_${((i % 4)+4)%4}.jpg`;

/* ---------- calculs ---------- */
function evs(k){ return S.events.filter(e => e.kid === k.id); }
function sinceReset(k){
  const all = evs(k); let i = -1;
  all.forEach((e,j) => { if(e.type==="rwd") i = j; });
  return all.slice(i+1);
}
function stats(k){
  const cur = sinceReset(k);
  const p = cur.filter(e=>e.type==="pos").length, n = cur.filter(e=>e.type==="neg").length;
  const all = evs(k);
  return {p, n, bal:Math.max(0,p-n), tp:all.filter(e=>e.type==="pos").length, tn:all.filter(e=>e.type==="neg").length};
}

/* ---------- navigation ---------- */
let view = {name:"home"};
function go(v){ view = v; render(); window.scrollTo(0,0); }

function badgeHTML(k, label, positive, idx, cls=""){
  return `<button class="bdg ${positive?"pos":"neg"} ${cls}" data-l="${esc(label)}" style="background-image:url('${imgOf(k, idx)}')"><span class="lb">${esc(label)}</span></button>`;
}

function render(){
  const app = $("#app");
  if(view.name==="home") app.innerHTML = home();
  else if(view.name==="kid") app.innerHTML = kidView(kid(view.id));
  else if(view.name==="pick") app.innerHTML = pickView(kid(view.id), view.pos);
  bind();
}

function home(){
  return `<div class="top"><div><h1>⭐ Mes Badges</h1><p class="sub">Touche un enfant pour donner un badge</p></div>
  <button class="ibtn" id="gear" aria-label="Réglages">⚙️</button></div>
  ${S.kids.map(k=>{const st=stats(k);const pc=Math.min(100,Math.round(st.bal/Math.max(1,k.goal)*100));
   return `<button class="kid" data-go="${k.id}">
    <div class="av" style="background-image:url('${imgOf(k,k.av)}')"></div>
    <div style="flex:1;min-width:0"><h2>${esc(k.name)}</h2>
     <div class="cnt"><span class="p">👍 ${st.p}</span><span class="n">⚠️ ${st.n}</span></div>
     <div class="bar"><i style="width:${pc}%"></i></div></div>
    <div class="bal"><b>${st.bal}</b><small>/ ${k.goal}</small></div></button>`}).join("")}
  ${S.kids.length?"":`<p class="empty">Aucun enfant. Ajoute-en dans les réglages.</p>`}`;
}

function kidView(k){
  const st = stats(k);
  const pc = Math.min(100, Math.round(st.bal/Math.max(1,k.goal)*100));
  const done = st.bal >= k.goal;
  const hist = evs(k).slice().reverse().slice(0,30);
  return `<button class="back" id="back">← Retour</button>
  <div class="hero"><div class="av" style="background-image:url('${imgOf(k,k.av)}')"></div>
   <div><h2>${esc(k.name)}</h2><div class="cnt"><span class="p">👍 ${st.p}</span><span class="n">⚠️ ${st.n}</span><span>Total : ${st.bal}</span></div></div></div>
  <div class="rew">🎁 Objectif : <b>${st.bal} / ${k.goal}</b> — ${esc(k.reward)}
   <div class="bar"><i style="width:${pc}%"></i></div>
   ${done?`<div class="row"><button class="btn" id="claim">🎉 Récompense donnée, repartir à zéro</button></div>`:""}</div>
  <div class="two"><button class="big p" id="bp"><span>👍</span>Bravo !</button><button class="big n" id="bn"><span>⚠️</span>Oups !</button></div>
  <div class="sec">Historique</div>
  ${hist.length?`<ul class="hist">${hist.map(e=>`<li><span class="dot ${e.type}">${e.type==="pos"?"+1":e.type==="neg"?"−1":"🎁"}</span>
   <span>${esc(e.label)}</span><time>${fmt(e.ts)}</time><button data-del="${e.id}" aria-label="Supprimer">✕</button></li>`).join("")}</ul>`:`<p class="empty">Aucun badge pour l'instant.</p>`}`;
}

function pickView(k, positive){
  const list = positive ? S.pos : S.neg;
  return `<button class="back" id="back">← ${esc(k.name)}</button>
  <h1 style="color:${positive?"var(--g)":"var(--r)"}">${positive?"Quel badge Bravo ?":"Quel badge Oups ?"}</h1>
  <div class="grid">${list.map((l,i)=>badgeHTML(k,l,positive,i)).join("")}</div>`;
}

function fmt(ts){
  const d = new Date(ts), now = new Date();
  const same = d.toDateString()===now.toDateString();
  const y = new Date(now-864e5).toDateString()===d.toDateString();
  const h = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return same?`Aujourd'hui<br>${h}`:y?`Hier<br>${h}`:`${d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}<br>${h}`;
}

/* ---------- événements ---------- */
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go({name:"kid",id:b.dataset.go}));
  const g=$("#gear"); if(g) g.onclick=()=>askPin(openSettings);
  const bk=$("#back"); if(bk) bk.onclick=()=> go(view.name==="pick"?{name:"kid",id:view.id}:{name:"home"});
  const bp=$("#bp"); if(bp) bp.onclick=()=>go({name:"pick",id:view.id,pos:true});
  const bn=$("#bn"); if(bn) bn.onclick=()=>go({name:"pick",id:view.id,pos:false});
  document.querySelectorAll(".grid .bdg").forEach(b=>b.onclick=()=>award(view.id,view.pos,b.dataset.l,b));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>askPin(()=>{
    S.events=S.events.filter(e=>e.id!==b.dataset.del); save(); render(); toast("Badge supprimé");}));
  const c=$("#claim"); if(c) c.onclick=()=>{ const k=kid(view.id);
    S.events.push({id:uid(),kid:k.id,type:"rwd",label:"Récompense : "+k.reward,ts:Date.now()}); save(); confetti(); beep("win"); render(); };
}

function award(kidId, positive, label, el){
  const k = kid(kidId);
  const idx = (positive?S.pos:S.neg).indexOf(label);
  S.events.push({id:uid(),kid:k.id,type:positive?"pos":"neg",label,ts:Date.now()});
  save();
  const pop = $("#pop");
  pop.innerHTML = `<div class="box ${positive?"":"shake"}"><h3 style="color:${positive?"var(--g)":"var(--r)"}">${positive?"Bravo "+esc(k.name)+" !":"Oups "+esc(k.name)+"…"}</h3>
   ${badgeHTML(k,label,positive,idx,"")}<div style="color:var(--mut);margin-bottom:12px">${positive?"+1 point":"−1 point"}</div>
   <button class="btn ${positive?"":"red"}" id="ok">OK</button></div>`;
  pop.classList.add("on");
  if(positive){ confetti(); beep("ok"); } else { beep("no"); if(navigator.vibrate) navigator.vibrate([80,60,80]); }
  const close=()=>{ pop.classList.remove("on"); go({name:"kid",id:k.id}); };
  $("#ok").onclick=close; pop.onclick=e=>{ if(e.target===pop) close(); };
}

/* ---------- code parent ---------- */
function askPin(cb){
  if(!S.pin) return cb();
  const p = prompt("Code parent (4 chiffres) :");
  if(p===null) return;
  if(p===S.pin) cb(); else toast("Code incorrect");
}

/* ---------- réglages ---------- */
function openSettings(){
  const sh = document.createElement("div"); sh.className="sheet";
  const draw = () => {
    sh.innerHTML = `<div><div class="top"><h1>⚙️ Réglages</h1><button class="ibtn" id="x">✕</button></div>
    ${S.kids.map(k=>`<div class="card" data-k="${k.id}"><label>Prénom</label><input type="text" data-f="name" value="${esc(k.name)}">
      <label>Photo</label><div class="avs">${[0,1,2,3].map(i=>`<div class="av ${k.av===i?"sel":""}" data-av="${i}" style="background-image:url('${imgOf(k,i)}')"></div>`).join("")}</div>
      <label>Objectif (points pour la récompense)</label><input type="number" min="1" data-f="goal" value="${k.goal}">
      <label>Récompense</label><input type="text" data-f="reward" value="${esc(k.reward)}">
      <div class="row"><button class="btn sec2" data-zero="${k.id}">Remettre à zéro</button></div></div>`).join("")}
    <div class="card"><b>👍 Badges Bravo</b><div class="chips" style="margin:8px 0">${S.pos.map((l,i)=>`<span class="chip">${esc(l)}<button data-rp="${i}">✕</button></span>`).join("")}</div>
      <div class="row"><input type="text" id="np" placeholder="Nouveau badge Bravo" style="flex:1"><button class="btn" id="ap">+</button></div></div>
    <div class="card"><b>⚠️ Badges Oups</b><div class="chips" style="margin:8px 0">${S.neg.map((l,i)=>`<span class="chip">${esc(l)}<button data-rn="${i}">✕</button></span>`).join("")}</div>
      <div class="row"><input type="text" id="nn" placeholder="Nouveau badge Oups" style="flex:1"><button class="btn red" id="an">+</button></div></div>
    <div class="card"><label style="margin-top:0">Code parent (4 chiffres, vide = aucun)</label><input type="password" inputmode="numeric" maxlength="4" id="pin" value="${esc(S.pin)}">
      <label><input type="checkbox" id="snd" ${S.sound?"checked":""}> Sons activés</label></div>
    <div class="card"><b>💾 Sauvegarde</b><div class="row"><button class="btn sec2" id="exp">Exporter</button><button class="btn sec2" id="imp">Importer</button></div>
      <input type="file" id="file" accept="application/json" hidden></div>
    <div class="row"><button class="btn" id="done" style="flex:1">Enregistrer et fermer</button></div></div>`;
    const close = () => { sh.remove(); save(); render(); };
    sh.querySelector("#x").onclick = sh.querySelector("#done").onclick = () => { readFields(); close(); };
    sh.querySelectorAll("[data-av]").forEach(a=>a.onclick=()=>{ readFields(); kid(a.closest("[data-k]").dataset.k).av=+a.dataset.av; draw(); });
    sh.querySelectorAll("[data-zero]").forEach(b=>b.onclick=()=>{ if(confirm("Effacer tout l'historique de cet enfant ?")){ S.events=S.events.filter(e=>e.kid!==b.dataset.zero); save(); toast("Remis à zéro"); }});
    sh.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{ readFields(); S.pos.splice(+b.dataset.rp,1); draw(); });
    sh.querySelectorAll("[data-rn]").forEach(b=>b.onclick=()=>{ readFields(); S.neg.splice(+b.dataset.rn,1); draw(); });
    sh.querySelector("#ap").onclick=()=>{ readFields(); const v=sh.querySelector("#np").value.trim(); if(v){ S.pos.push(v); draw(); } };
    sh.querySelector("#an").onclick=()=>{ readFields(); const v=sh.querySelector("#nn").value.trim(); if(v){ S.neg.push(v); draw(); } };
    sh.querySelector("#exp").onclick=exportData;
    sh.querySelector("#imp").onclick=()=>sh.querySelector("#file").click();
    sh.querySelector("#file").onchange=e=>importData(e.target.files[0], ()=>{ sh.remove(); render(); });
  };
  const readFields = () => {
    sh.querySelectorAll("[data-k]").forEach(c=>{ const k=kid(c.dataset.k);
      c.querySelectorAll("[data-f]").forEach(i=>{ const f=i.dataset.f; k[f]= f==="goal" ? Math.max(1,parseInt(i.value)||20) : i.value.trim()||k[f]; }); });
    const p=sh.querySelector("#pin"); if(p) S.pin=(p.value||"").replace(/\D/g,"").slice(0,4);
    const s=sh.querySelector("#snd"); if(s) S.sound=s.checked;
    save();
  };
  document.body.appendChild(sh); draw();
}
function exportData(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  a.download="badges-sauvegarde-"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importData(f,cb){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.kids||!d.events) throw 0; S=d; save(); toast("Sauvegarde restaurée"); cb(); }catch(e){ toast("Fichier invalide"); } };
  r.readAsText(f);
}

/* ---------- effets ---------- */
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2000); }
let ac;
function beep(kind){
  if(!S.sound) return;
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==="no" ? [[220,.18],[165,.28]] : kind==="win" ? [[523,.12],[659,.12],[784,.12],[1047,.3]] : [[523,.1],[784,.2]];
    let t = ac.currentTime;
    seq.forEach(([f,d])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=kind==="no"?"sawtooth":"triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d); t+=d; });
  }catch(e){}
}
function confetti(){
  const c=$("#fx"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#2e9e4f","#ffc828","#ff8c00","#3b82f6","#ec4899"];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let n=0;
  (function f(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy+=.45; p.x+=p.vx; p.y+=p.vy; p.r+=.2; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); });
    if(++n<110) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------- démarrage ---------- */
render();
if(!S.seen){ S.seen=true; save(); setTimeout(()=>toast("Astuce : ⚙️ pour changer les prénoms"),800); }
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
